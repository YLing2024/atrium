<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f6f3" />
    <meta name="description" content="Yunling Zhang — a quiet corner of the web, made by hand. Interfaces on the front, infrastructure underneath." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Yunling" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <link id="hljs-light" rel="stylesheet" href="/hljs/github.css" media="(prefers-color-scheme: light)" />
    <link id="hljs-dark" rel="stylesheet" href="/hljs/github-dark.css" media="(prefers-color-scheme: dark)" />
    <script>
      // 主题：在首帧前落地（变量色 + 代码高亮），避免刷新时闪回系统配色
      try {
        var t = localStorage.getItem('site_theme')
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', t === 'dark' ? '#13110f' : '#f7f6f3')
          var l = document.getElementById('hljs-light')
          var d = document.getElementById('hljs-dark')
          if (l) l.setAttribute('media', t === 'dark' ? 'not all' : 'all')
          if (d) d.setAttribute('media', t === 'dark' ? 'all' : 'not all')
        }
      } catch (e) {}
    </script>
    <title>Yunling Zhang — A quiet corner of the web</title>
      <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
<!-- brand-icons -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
